<!doctype html>
<html>
	<head>
        <style>#jugador{width: 20px;height: 20px;background: red;position: absolute;}</style>
  </head>
  <body>
    <div id="jugador"></div>
   	<script>
        let temporizador = setTimeout("bucle()",1000); // Creo un temporizador

        function bucle(){
        // Pongo una posición aleatoria para el npc
      	document.querySelector("#jugador").style.left = Math.random()*500+"px"
        document.querySelector("#jugador").style.top = Math.random()*500+"px"
        clearTimeout(temporizador) // Elimino temporizador para no acumular
        temporizador = setTimeout("bucle()",1000); // Llamo a bucle de nuevo
      }
    </script>
  </body>
</html>
